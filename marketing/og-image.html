<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0E0E12;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .og {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0E0E12;
      overflow: hidden;
    }
    .og::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 42% 58% at 50% 50%, rgba(10,132,255,0.28) 0%, transparent 68%),
        radial-gradient(ellipse 70% 80% at 50% 50%, transparent 42%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
    }
    /* Instagram DM crops the center 630×630; keep all type inside. */
    .safe {
      position: relative;
      z-index: 1;
      width: 630px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 36px;
    }
    .mark {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      margin-bottom: 22px;
    }
    .name {
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1;
      color: #F5F5F7;
      margin-bottom: 28px;
    }
    .name-swipe { color: #409CFF; }
    .slogan {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -0.035em;
      color: #F5F5F7;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="safe">
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#0A0A0A"/>
        <rect x="5.2" y="9.4" width="13.2" height="15.6" rx="2.6" transform="rotate(-16 5.2 9.4)" fill="#2C2C2E"/>
        <rect x="12.4" y="7.6" width="13.6" height="16.4" rx="2.8" fill="#0A84FF"/>
        <rect x="14.6" y="10.4" width="9.2" height="1.5" rx="0.75" fill="rgba(255,255,255,0.35)"/>
        <rect x="14.6" y="13.4" width="6.4" height="1.5" rx="0.75" fill="rgba(255,255,255,0.22)"/>
      </svg>
      <div class="name">beat<span class="name-swipe">swipe</span>.app</div>
      <p class="slogan">Your bio link.<br>Their next beat.</p>
    </div>
  </div>
</body>
</html>
