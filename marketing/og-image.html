<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0E0E12;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .og {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0E0E12;
      overflow: hidden;
    }
    .og::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 42% 58% at 50% 50%, rgba(10,132,255,0.28) 0%, transparent 68%),
        radial-gradient(ellipse 70% 80% at 50% 50%, transparent 42%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
    }
    /* Instagram DM crops the center 630×630; keep all type inside. */
    .safe {
      position: relative;
      z-index: 1;
      width: 630px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 36px;
    }
    .mark {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      margin-bottom: 22px;
      display: block;
    }
    .name {
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1;
      color: #F5F5F7;
      margin-bottom: 28px;
    }
    .name-swipe { color: #409CFF; }
    .slogan {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -0.035em;
      color: #F5F5F7;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="safe">
      <img class="mark" src="/favicon.png" alt="" width="56" height="56">
      <div class="name">beat<span class="name-swipe">swipe</span>.app</div>
      <p class="slogan">Your bio link.<br>Their next beat.</p>
    </div>
  </div>
</body>
</html>
